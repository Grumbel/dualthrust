<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img">
  <title>dualthrust</title>
  <defs>
    <radialGradient id="screen" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#06301a"/>
      <stop offset="0.65" stop-color="#021a0c"/>
      <stop offset="1" stop-color="#000a04"/>
    </radialGradient>
    <clipPath id="glass"><rect x="9" y="9" width="110" height="110" rx="12"/></clipPath>
  </defs>

  <!-- CRT bezel and screen -->
  <rect x="3" y="3" width="122" height="122" rx="17" fill="#0b2415" stroke="#1d5a35" stroke-width="2.5"/>
  <rect x="9" y="9" width="110" height="110" rx="12" fill="url(#screen)"/>

  <g clip-path="url(#glass)">
    <!-- cave: rock outline all around, a flat pad in the floor -->
    <path d="M9 30 C22 28 26 40 20 50 C14 60 22 68 14 80 L9 84 Z" fill="#0a3a1e" opacity="0.8"/>
    <path d="M119 22 C106 26 104 36 110 46 C116 56 108 62 112 72 L119 76 Z" fill="#0a3a1e" opacity="0.8"/>
    <path d="M9 30 C22 28 26 40 20 50 C14 60 22 68 14 80" fill="none" stroke="#33ff66" stroke-width="2" stroke-linecap="round"/>
    <path d="M119 22 C106 26 104 36 110 46 C116 56 108 62 112 72" fill="none" stroke="#33ff66" stroke-width="2" stroke-linecap="round"/>
    <path d="M9 108 L26 102 L40 104 L44 100 L84 100 L90 104 L104 100 L119 106 L119 119 L9 119 Z" fill="#0a3a1e" opacity="0.9"/>
    <path d="M9 108 L26 102 L40 104 L44 100 M84 100 L90 104 L104 100 L119 106" fill="none" stroke="#33ff66" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M44 100 L84 100" stroke="#8dffb4" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="44" cy="98" r="1.8" fill="#ffd24a"/>
    <circle cx="84" cy="98" r="1.8" fill="#ffd24a"/>

    <!-- the lander (glow layer first, then the sharp line) -->
    <g transform="translate(2 -2) scale(0.8)" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <g id="ship-glow" stroke="#33ff66" stroke-width="6" opacity="0.22">
        <path d="M60 22 L70 40 L72 56 L48 56 L50 40 Z"/>
        <path d="M36 66 L38 56 L50 56 L52 66 Z M68 66 L70 56 L82 56 L84 66 Z"/>
        <path d="M50 56 L30 80 M70 56 L90 80"/>
      </g>
      <g stroke="#9bffbc" stroke-width="2.6">
        <path d="M60 22 L70 40 L72 56 L48 56 L50 40 Z"/>
        <path d="M53 40 Q60 29 67 40 M50 48 L70 48" stroke-width="2"/>
        <path d="M36 66 L38 56 L50 56 L52 66 Z M68 66 L70 56 L82 56 L84 66 Z" stroke="#5dff8f"/>
        <path d="M50 56 L30 80 M70 56 L90 80 M23 80 L37 80 M83 80 L97 80" stroke="#5dff8f"/>
      </g>
      <!-- flames -->
      <path d="M38 68 L50 68 L44 90 Z M70 68 L82 68 L76 90 Z" fill="#ff7a28" stroke="none" opacity="0.95"/>
      <path d="M41 68 L47 68 L44 80 Z M73 68 L79 68 L76 80 Z" fill="#fff0c4" stroke="none"/>
    </g>

    <!-- rope with a hook, and the cargo crate -->
    <path d="M50 46 Q50 92 98 84" fill="none" stroke="#a6e6b8" stroke-width="2" stroke-dasharray="2.4 1.8" stroke-linecap="round"/>
    <path d="M98 84 L98 87 M95 88 Q98 92 101 88" fill="none" stroke="#9bffbc" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="89" y="90" width="20" height="14" fill="#031a24" stroke="#5ad0ff" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M89 90 L109 104 M109 90 L89 104" stroke="#5ad0ff" stroke-width="1.4" opacity="0.7"/>

    <!-- scanlines and a soft highlight on the glass -->
    <g stroke="#000" stroke-width="1" opacity="0.28">
      <path d="M9 18H119M9 26H119M9 34H119M9 42H119M9 50H119M9 58H119M9 66H119M9 74H119M9 82H119M9 90H119M9 98H119M9 106H119M9 114H119"/>
    </g>
    <path d="M16 14 H64 Q40 18 16 30 Z" fill="#fff" opacity="0.06"/>
  </g>
  <rect x="9" y="9" width="110" height="110" rx="12" fill="none" stroke="#02130a" stroke-width="2"/>
</svg>
